<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Zern</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Space+Grotesk:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script>
    try { var t = localStorage.getItem('theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
  <style>
    :root { --bg: #FAFAFA; --surface: #FFFFFF; --ink: #09090B; --muted: #475569; --line: #E4E4E7; --accent: #2563EB; }
    html[data-theme="dark"] { --bg: #09090B; --surface: #18181B; --ink: #FAFAFA; --muted: #A1A1AA; --line: #27272A; --accent: #60A5FA; color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: "Space Grotesk", system-ui, sans-serif; color: var(--ink);
      background-color: var(--bg);
      background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 48px 48px; background-position: -1px -1px; }
    .box { max-width: 560px; width: 100%; background: var(--surface); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 40px; }
    .code { font-family: "JetBrains Mono", monospace; color: var(--muted); font-size: 14px; }
    h1 { font-family: "Archivo", system-ui, sans-serif; font-weight: 800; font-size: clamp(56px, 14vw, 96px); letter-spacing: -0.05em; line-height: 1; margin: 10px 0 14px; }
    p { color: var(--muted); font-size: 17px; line-height: 1.6; }
    a.btn { display: inline-block; margin-top: 28px; padding: 11px 20px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none;
      border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
    a.btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
    a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <main class="box">
    <div class="code">GET this page → 404 Not Found</div>
    <h1>404</h1>
    <p>This page doesn't exist. The link may be mistyped or out of date.</p>
    <a class="btn" href="/">Back to the portfolio</a>
  </main>
</body>
</html>
